[tools]
node = "24.22.0"
pnpm = "12.14.0"

# Reference source only; package dependencies are managed separately by pnpm.
[bootstrap.repos]
".agents/repos/discern" = { url = "https://github.com/doeixd/discern.git", ref = "main" }
".agents/repos/effect" = { url = "https://github.com/Effect-TS/effect.git", ref = "main" }

[tasks]
bootstrap = { description = "Install locked package dependencies", run = "pnpm install --frozen-lockfile" }
check = { description = "Run all repository checks and build the library", run = "pnpm run check" }
"check:fast" = { description = "Run lint, TypeScript, and Effect feedback between edits", run = "pnpm run check:fast" }
"check:package" = { description = "Check an existing tarball in an isolated consumer", run = "pnpm run check:package" }
pack = { description = "Pack the already-built library without rebuilding", run = "pnpm --config.ignore-scripts=true pack --pack-destination artifacts" }
build = { description = "Build ESM and TypeScript declarations", run = "pnpm run build" }
fmt = { description = "Format project files", run = "pnpm run fmt" }
"fmt:check" = { description = "Check project formatting", run = "pnpm run fmt:check" }
lint = { description = "Build the library and run type-aware Oxlint", run = "pnpm run lint" }
typecheck = { description = "Check TypeScript and Effect diagnostics", run = "pnpm run typecheck" }
test = { description = "Run tests", run = "pnpm run test" }
"test:watch" = { description = "Run tests in watch mode", run = "pnpm run test:watch", interactive = true }
knip = { description = "Check unused code and dependencies", run = "pnpm run knip" }
"demo:dev" = { description = "Run the demo locally with supplied answers", run = "pnpm run build && pnpm --filter @robo-taxonomist/demo dev" }
"demo:check" = { description = "Check and build the demo", run = "pnpm run build && pnpm --filter @robo-taxonomist/demo check" }
"demo:test" = { description = "Test the demo", run = "pnpm run build && pnpm --filter @robo-taxonomist/demo test" }
"demo:browser:install" = { description = "Install Chromium and its system dependencies for browser tests", run = "pnpm --filter @robo-taxonomist/demo exec playwright install --with-deps chromium" }
"demo:credentials:check" = { description = "Validate local live-demo credentials without inference", run = "pnpm --filter @robo-taxonomist/demo credentials:check" }
"demo:credentials:account" = { description = "Store the live-demo account ID using a prompt", run = "pnpm --filter @robo-taxonomist/demo credentials:account", interactive = true }
"demo:credentials:token" = { description = "Store the live-demo token using a masked prompt", run = "pnpm --filter @robo-taxonomist/demo credentials:token", interactive = true }
"demo:dev:live" = { description = "Build the public library, then run the live provider demo", run = "pnpm run build && pnpm --filter @robo-taxonomist/demo dev:live" }
