name: Clef review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: clef-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve PR revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            base=$EVENT_BASE
            head=$EVENT_HEAD
          else
            [[ "$PR" =~ ^[1-9][0-9]*$ ]]
            revision=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq 'select(.state == "open" and .base.ref == "main") | [.base.sha, .head.sha] | @tsv')
            read -r base head <<< "$revision"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"

      - name: Mark PR revision pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context=clef-review \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Check out trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR objects without checkout
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Install pinned tooling
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.15"
          bootstrap: false

      - name: Install trusted dependencies
        run: mise run bootstrap

      - name: Review PR source
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the Actions variable CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Set the Actions secret CLOUDFLARE_API_TOKEN}"
          mise exec -- node tools/review/cli.ts --base "$BASE_SHA" --commit "$HEAD_SHA"

      - name: Publish PR revision status
        if: always() && steps.revisions.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=clef-review \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
