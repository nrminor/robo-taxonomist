name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fresh pinned tooling
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.15"
          bootstrap: false
          cache: false

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(mise exec -- pnpm pkg get version)"

      - name: Install locked dependencies
        run: mise run bootstrap

      - name: Install browser test dependencies
        run: mise run demo:browser:install

      - name: Check source and tooling
        run: mise run check

      - name: Pack library
        run: mise run pack

      - name: Check packed package in isolation
        run: mise run check:package -- artifacts/*.tgz

      - name: Checksum package
        working-directory: artifacts
        run: sha256sum *.tgz > SHA256SUMS

      - name: Include pinned publishing tools
        run: cp mise.toml mise.lock artifacts/

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts

      - name: Verify package checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS

      - name: Create draft release and publish after assets upload
        # If publication fails, inspect the remaining draft and its assets before
        # publishing it manually. Reruns never overwrite an existing release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.tgz artifacts/SHA256SUMS --verify-tag --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false

  stage-npm:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: artifacts
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified package and tool pins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts

      - name: Verify package checksum
        run: sha256sum --check SHA256SUMS

      - name: Install fresh pinned publishing tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.15"
          bootstrap: false
          cache: false
          working_directory: artifacts

      - name: Stage stable release with trusted publishing
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Automatic npm staging requires a stable vX.Y.Z tag; prerelease dist-tags need a separate policy." >&2
            exit 1
          fi
          mise exec -- pnpm stage publish *.tgz --registry=https://registry.npmjs.org --access=public --tag=latest --ignore-scripts --no-git-checks --provenance --json > staged-package.json
          cat staged-package.json

      - name: Report required maintainer approval
        run: |
          {
            printf '### npm approval required for %s\n\n' "$RELEASE_TAG"
            printf 'The package is staged. A maintainer must review it and approve it with 2FA.\n\n'
            printf 'Staging receipt:\n\n```json\n'
            cat staged-package.json
            printf '\n```\n\n'
            printf 'Use the stage ID above with `pnpm stage view` and `pnpm stage download`. Compare the downloaded archive with the GitHub release checksum and review its provenance before approving.\n\n'
            printf 'Approve from your own authenticated terminal with `pnpm stage approve <stage-id>`, or through npmjs.com. Keep tokens and 2FA codes out of CI.\n\n'
            printf 'After approval, manually compare the npm archive with the checksummed GitHub release artifact.\n'
          } >> "$GITHUB_STEP_SUMMARY"
